[project]
name = "omyds"
version = "0.1.9.12"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "prompt_toolkit>=3.0",
    "rich>=15.0.0",
]

[project.scripts]
OmyDs = "omyds.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["omyds"]